    <text x="504" y="258" font-size="15" font-weight="760" fill="#e9eef6">FreeBSD guest</text>
    <rect x="770" y="245" width="94" height="18" rx="9" fill="#27203c" stroke="#a78bfa"/><text x="817" y="258" text-anchor="middle" font-size="10.5" font-weight="800" letter-spacing="1" fill="#d8cdfd">EXPERIMENT</text>
    <text x="504" y="278" font-size="12" fill="#97a3b6">operator-run boots reach a shell; no network device</text>

    <rect x="506" y="290" width="352" height="66" rx="6" fill="#171421" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="520" y="311" font-size="14" font-weight="760" fill="#e9eef6">Post-quantum key exchange</text>
    <rect x="754" y="298" width="94" height="18" rx="9" fill="#27203c" stroke="#a78bfa"/><text x="801" y="311" text-anchor="middle" font-size="10.5" font-weight="800" letter-spacing="1" fill="#d8cdfd">EXPERIMENT</text>
    <text x="520" y="332" font-size="12" fill="#97a3b6">hybrid exchange on guest loopback;</text>
    <text x="520" y="348" font-size="12" fill="#97a3b6">identities classical</text>

    <rect x="70" y="392" width="820" height="58" rx="8" fill="#0d1419" stroke="#303a4b" stroke-width="1.5"/>
    <text x="84" y="414" font-size="14" font-weight="760" fill="#e9eef6">Mesh tunnels between paired machines</text>
    <text x="400" y="414" font-size="12" fill="#97a3b6">loopback TCP over the mesh stream</text>
    <rect x="810" y="400" width="70" height="18" rx="9" fill="#123027" stroke="#3ddc97"/><text x="845" y="413" text-anchor="middle" font-size="10.5" font-weight="800" letter-spacing="1" fill="#86edbd">ON MAIN</text>
    <rect x="84" y="424" width="236" height="20" rx="10" fill="#0c1118" stroke="#5ea8ff"/><text x="202" y="438" text-anchor="middle" font-size="11" fill="#b9d9ff">entrances that survive restart</text>
    <rect x="330" y="425" width="86" height="18" rx="9" fill="#14243a" stroke="#5ea8ff"/><text x="373" y="438" text-anchor="middle" font-size="10.5" font-weight="800" letter-spacing="1" fill="#b9d9ff">CANDIDATE</text>

    <rect x="70" y="460" width="820" height="40" rx="8" fill="#0d1419" stroke="#303a4b" stroke-width="1.5"/>
    <text x="84" y="485" font-size="14" font-weight="760" fill="#e9eef6">Onion transport</text>
    <text x="224" y="485" font-size="12" fill="#97a3b6">embedded Tor is the default build; a stub must be asked for by name</text>
    <rect x="810" y="471" width="70" height="18" rx="9" fill="#123027" stroke="#3ddc97"/><text x="845" y="484" text-anchor="middle" font-size="10.5" font-weight="800" letter-spacing="1" fill="#86edbd">ON MAIN</text>

    <rect x="50" y="524" width="860" height="72" rx="12" fill="#111923" stroke="#303a4b" stroke-width="1.5"/>
    <text x="70" y="545" font-size="15" font-weight="780" fill="#e9eef6">How a change lands</text>
    <rect x="828" y="532" width="70" height="18" rx="9" fill="#123027" stroke="#3ddc97"/><text x="863" y="545" text-anchor="middle" font-size="10.5" font-weight="800" letter-spacing="1" fill="#86edbd">ON MAIN</text>
    <g font-size="12" font-weight="650" fill="#c3ccd9" text-anchor="middle">
