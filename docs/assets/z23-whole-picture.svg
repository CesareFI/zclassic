    <rect x="294" y="316" width="70" height="18" rx="9" fill="#123027" stroke="#3ddc97"/><text x="329" y="329" text-anchor="middle" font-size="10.5" font-weight="800" letter-spacing="1" fill="#86edbd">ON MAIN</text>
    <text x="372" y="329" font-size="12" fill="#97a3b6">zssh module</text>
    <rect x="286" y="344" width="70" height="18" rx="9" fill="#123027" stroke="#3ddc97"/><text x="321" y="357" text-anchor="middle" font-size="10.5" font-weight="800" letter-spacing="1" fill="#86edbd">ON MAIN</text>

    <rect x="474" y="188" width="416" height="190" rx="10" fill="#0d1419" stroke="#303a4b" stroke-width="1.5"/>
    <text x="488" y="216" font-size="16" font-weight="780" fill="#e9eef6">Emulated RISC-V machine</text>
    <text x="706" y="216" font-size="12" fill="#97a3b6">in z23-dev</text>
    <path d="M488 226H548" stroke="#f2708a" stroke-width="3"/>
    <rect x="808" y="200" width="70" height="18" rx="9" fill="#123027" stroke="#3ddc97"/><text x="843" y="213" text-anchor="middle" font-size="10.5" font-weight="800" letter-spacing="1" fill="#86edbd">ON MAIN</text>

