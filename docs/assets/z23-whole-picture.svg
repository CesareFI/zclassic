<svg xmlns="http://www.w3.org/2000/svg" width="960" height="780" viewBox="0 0 960 780" role="img" aria-labelledby="whole-title whole-desc">
  <title id="whole-title">Z23: the whole picture and the status of each part</title>
  <desc id="whole-desc">Nested boxes show one Z23 program inside your machine's local-authority boundary: a full node, the C23 Commons with an ML-KEM-768 module used by the unintegrated zssh engine, and an emulated RISC-V machine, built into the developer binary z23-dev, that contains a FreeBSD guest and a post-quantum key exchange, with mesh tunnels and an onion transport below. Every element carries one of four status labels: ON MAIN, CANDIDATE, EXPERIMENT or TARGET. The guest and the post-quantum exchange are experiment-level. Two dashed target boxes name goals: a guest-to-guest tunnel between machines, and warm compile and focused proof, p95 within 10 seconds on a frozen small-change corpus. The landing path lists edit, focused proof, integrate current main, gates and push.</desc>
  <defs>
    <linearGradient id="whole-node" x1="0" x2="1">
      <stop offset="0" stop-color="#10243b"/>
      <stop offset="0.5" stop-color="#111923"/>
      <stop offset="1" stop-color="#241a3d"/>
    </linearGradient>
    <pattern id="whole-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#202836" stroke-width="1"/>
    </pattern>
    <marker id="whole-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#3ddc97"/>
    </marker>
  </defs>
  <rect width="960" height="780" fill="#090c11"/>
  <rect width="960" height="780" fill="url(#whole-grid)" opacity="0.34"/>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="30" y="60" font-size="30" font-weight="780" letter-spacing="2" fill="#e9eef6">Z23 · THE WHOLE PICTURE</text>
    <text x="30" y="90" font-size="16" fill="#97a3b6">one program you build and run yourself; every part labelled by what is true today</text>

    <rect x="30" y="108" width="900" height="500" rx="24" fill="#0c1118" stroke="#3ddc97" stroke-width="3"/>
    <text x="54" y="132" font-size="13" font-weight="760" letter-spacing="2" fill="#3ddc97">YOUR MACHINE · LOCAL AUTHORITY</text>

    <rect x="50" y="148" width="860" height="364" rx="16" fill="url(#whole-node)" stroke="#303a4b" stroke-width="1.5"/>
    <text x="70" y="173" font-size="16" font-weight="780" fill="#e9eef6">Z23 program (C23)</text>
    <rect x="828" y="158" width="70" height="18" rx="9" fill="#123027" stroke="#3ddc97"/><text x="863" y="171" text-anchor="middle" font-size="10.5" font-weight="800" letter-spacing="1" fill="#86edbd">ON MAIN</text>

    <rect x="70" y="188" width="190" height="190" rx="10" fill="#0d1419" stroke="#303a4b" stroke-width="1.5"/>
    <text x="84" y="216" font-size="16" font-weight="780" fill="#e9eef6">Full node</text>
    <path d="M84 226H144" stroke="#5ea8ff" stroke-width="3"/>
    <text x="84" y="246" font-size="13" fill="#b9d9ff">checks every block</text>
    <text x="84" y="262" font-size="13" fill="#b9d9ff">itself; keeps</text>
    <text x="84" y="278" font-size="13" fill="#b9d9ff">transparent and</text>
    <text x="84" y="294" font-size="13" fill="#b9d9ff">shielded wallet state</text>
    <text x="84" y="318" font-size="12" fill="#97a3b6">v1 criteria status:</text>
    <text x="84" y="334" font-size="12" fill="#97a3b6">see MVP.md</text>
    <rect x="84" y="344" width="70" height="18" rx="9" fill="#123027" stroke="#3ddc97"/><text x="119" y="357" text-anchor="middle" font-size="10.5" font-weight="800" letter-spacing="1" fill="#86edbd">ON MAIN</text>

    <rect x="272" y="188" width="190" height="190" rx="10" fill="#0d1419" stroke="#303a4b" stroke-width="1.5"/>
    <text x="286" y="216" font-size="16" font-weight="780" fill="#e9eef6">C23 Commons</text>
    <path d="M286 226H346" stroke="#a78bfa" stroke-width="3"/>
    <text x="286" y="252" font-size="13" fill="#d8cdfd">exact package root,</text>
    <text x="286" y="270" font-size="13" fill="#d8cdfd">fetched and rebuilt</text>
    <text x="286" y="288" font-size="13" fill="#d8cdfd">byte-identically</text>
