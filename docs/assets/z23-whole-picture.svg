    <rect x="546" y="647" width="64" height="18" rx="9" fill="#352918" stroke="#f0b44c"/><text x="578" y="660" text-anchor="middle" font-size="10.5" font-weight="800" letter-spacing="1" fill="#f7d28a">TARGET</text>

