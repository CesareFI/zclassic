    <rect x="30" y="720" width="70" height="18" rx="9" fill="#123027" stroke="#3ddc97"/><text x="65" y="733" text-anchor="middle" font-size="10.5" font-weight="800" letter-spacing="1" fill="#86edbd">ON MAIN</text>
    <text x="110" y="733" font-size="13" fill="#c3ccd9">in the tracked source</text>
    <rect x="490" y="720" width="86" height="18" rx="9" fill="#14243a" stroke="#5ea8ff"/><text x="533" y="733" text-anchor="middle" font-size="10.5" font-weight="800" letter-spacing="1" fill="#b9d9ff">CANDIDATE</text>
