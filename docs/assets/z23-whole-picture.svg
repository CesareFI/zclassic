    <text x="134" y="759" font-size="13" fill="#c3ccd9">one recorded run, not a product claim</text>
    <rect x="490" y="746" width="64" height="18" rx="9" fill="#352918" stroke="#f0b44c"/><text x="522" y="759" text-anchor="middle" font-size="10.5" font-weight="800" letter-spacing="1" fill="#f7d28a">TARGET</text>
    <text x="564" y="759" font-size="13" fill="#c3ccd9">stated goal</text>
  </g>
